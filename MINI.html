<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="icon" href="https://google.com/favicon.ico" type="image/png">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #111827;
            color: #f3f4f6;
        }
    </style>

    <!-- Load the libcurl.js WebAssembly bundle -->
    <script src="https://cdn.jsdelivr.net/npm/libcurl.js@latest/libcurl_full.js"></script>
</head>
<body>

    <div class="container" id="ui-container">
        <h1>MINI</h1>
        <p>the simplest web browser</p>
        
        <!-- Wrapped in a form to handle 'Enter' key submissions out of the box -->
        <form onsubmit="event.preventDefault(); loadProxy();" class="input-group">
            <input type="text" id="urlInput" placeholder="https://example.com">
            <button id="goBtn" type="submit" disabled>Loading WASM...</button>
        </form>
        
        <div id="statusMsg" class="status">Initializing WebAssembly runtime...</div>
    </div>

    <script>
        const websocketGateway = 'wss://wisp.mercurywork.shop';
        
        // Initialize libcurl on home page load
        window.addEventListener('load', async () => {
            try {
                await libcurl.ready;
                libcurl.set_websocket(websocketGateway);
                document.getElementById('statusMsg').textContent = "Ready!";
                document.getElementById('statusMsg').style.color = "#10b981";
                document.getElementById('goBtn').disabled = false;
                document.getElementById('goBtn').textContent = "Go";
            } catch (e) {
                document.getElementById('statusMsg').textContent = "WASM Init Failed.";
                console.error(e);
            }
        });

        // The core fetch and rewrite function
        async function fetchAndRender(targetUrl) {
            console.log("Proxying target:", targetUrl);
            try {
                const response = await libcurl.fetch(targetUrl, {
                    method: 'GET',
                    headers: { 'User-Agent': navigator.userAgent }
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                let html = await response.text();

                // 1. Base URL for asset resolution
                const baseTag = `<base href="${targetUrl}">`;
                
                // 2. Build the self-propagating payload
                const injectionScript = `
                <script src="https://cdn.jsdelivr.net/npm/libcurl.js@latest/libcurl_full.js"><\/script>
                <script>
                    const gateway = '${websocketGateway}';
                    let wasmReady = false;

                    // Immediately intercept clicks before WASM finishes loading
                    setupInterceptors();

                    // Re-initialize libcurl WebAssembly
                    libcurl.ready.then(() => {
                        libcurl.set_websocket(gateway);
                        wasmReady = true;
                        console.log("libcurl.js successfully re-initialized.");
                    }).catch(err => {
                        console.error("Failed to initialize libcurl inside proxy:", err);
                    });

                    // Stringified proxy function carried over to the new page
                    ${fetchAndRender.toString()}

                    function setupInterceptors() {
                        // Global click event listener
                        document.addEventListener('click', function(e) {
                            // Find closest anchor tag (handles nested spans, images, etc.)
                            const anchor = e.target.closest('a');
                            if (!anchor) return;

                            const href = anchor.getAttribute('href');
                            
                            // Skip hash-only anchors, javascript links, or empty links
                            if (!href || href.startsWith('#') || href.startsWith('javascript:')) {
                                return;
                            }

                            // Prevent browser from doing default navigation
                            e.preventDefault();

                            // Resolve the URL relative to the current base href
                            const resolvedUrl = anchor.href; 

                            if (wasmReady) {
                                // Strip target="_blank" to keep navigation inside the same tab
                                anchor.removeAttribute('target');
                                fetchAndRender(resolvedUrl);
                            } else {
                                console.warn("WASM is not ready yet. Retrying navigation in 500ms...");
                                setTimeout(() => fetchAndRender(resolvedUrl), 500);
                            }
                        }, true); // Use capture phase to catch events early

                        // Global form submission listener
                        document.addEventListener('submit', function(e) {
                            const form = e.target;
                            const action = form.action || window.location.href;
                            
                            if (form.method.toLowerCase() === 'get') {
                                e.preventDefault();
                                const params = new URLSearchParams(new FormData(form)).toString();
                                const target = action + (action.includes('?') ? '&' : '?') + params;
                                fetchAndRender(target);
                            }
                        }, true);
                    }
                <\/script>
                `;
                if (html.includes('<head>')) {
                    html = html.replace('<head>', `<head>${baseTag}${injectionScript}`);
                } else {
                    html = baseTag + injectionScript + html;
                }
                document.open();
                document.write(html);
                document.close();

            } catch (err) {
                alert("Proxy Error: " + err.message);
                console.error(err);
            }
        }
        function loadProxy() {
            let input = document.getElementById('urlInput').value.trim();
            if (!input) return;
            let targetUrl;
            if (/^https?:\/\//i.test(input)) {
                targetUrl = input;
            } 
            else if (/^[a-zA-Z0-9-]+\.[a-zA-Z0-9-.]+/.test(input) && !input.includes(' ')) {
                targetUrl = 'https://' + input;
            } 
            else {
                targetUrl = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(input);
            }
            window.__mini.go(targetUrl);
        }
    </script>
</body>
</html>
