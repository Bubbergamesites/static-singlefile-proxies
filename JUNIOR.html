<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUNIOR</title>
<style>
  :root { --bg:#111827; --panel:#1f2937; --panel2:#374151; --line:#374151; --text:#f3f4f6; --muted:#9ca3af; --accent:#10b981; --err:#f87171; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; }

  /* tab strip */
  #tabstrip { display:flex; align-items:flex-end; gap:2px; padding:6px 8px 0; background:#0b1220; overflow-x:auto; scrollbar-width:none; }
  #tabstrip::-webkit-scrollbar { display:none; }
  .tab { display:flex; align-items:center; gap:6px; flex:0 1 200px; min-width:90px; max-width:220px; height:32px; padding:0 6px 0 12px;
    background:#162033; color:var(--muted); border-radius:8px 8px 0 0; cursor:pointer; user-select:none; font-size:13px; }
  .tab:hover { background:#1b283e; }
  .tab.active { background:var(--panel); color:var(--text); }
  .tab .dot { width:8px; height:8px; border-radius:50%; background:var(--panel2); flex:none; }
  .tab.loading .dot { background:var(--accent); animation:pulse 1s ease-in-out infinite; }
  .tab.error .dot { background:var(--err); }
  @keyframes pulse { 50% { opacity:.25 } }
  .tab .ttl { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tab .x { flex:none; width:20px; height:20px; border:0; border-radius:50%; background:transparent; color:inherit; font-size:14px; line-height:1; cursor:pointer; }
  .tab .x:hover { background:rgba(255,255,255,.15); }
  #newTab { flex:none; width:30px; height:28px; margin:0 0 2px 4px; border:0; border-radius:6px; background:transparent; color:var(--muted); font-size:18px; cursor:pointer; }
  #newTab:hover { background:var(--panel); color:var(--text); }

  /* toolbar */
  #bar { display:flex; gap:6px; padding:8px; background:var(--panel); border-bottom:1px solid var(--line); align-items:center; }
  #bar button { background:var(--panel2); color:var(--text); border:0; border-radius:6px; min-width:36px; height:36px; font-size:16px; cursor:pointer; }
  #bar button:disabled { opacity:.35; cursor:default; }
  #bar button:not(:disabled):hover { background:#4b5563; }
  #addr { flex:1; display:flex; gap:6px; min-width:0; }
  #urlInput { flex:1; min-width:0; height:36px; padding:0 12px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:14px; }
  #urlInput:focus { outline:2px solid var(--accent); border-color:transparent; }
  #goBtn { background:var(--accent)!important; color:#062b1f!important; font-weight:600; padding:0 14px; }
  #progress { height:2px; }
  #progress.on { background:linear-gradient(90deg,transparent,var(--accent),transparent); background-size:50% 100%; background-repeat:no-repeat; animation:slide 1s linear infinite; }
  @keyframes slide { from{background-position:-50% 0} to{background-position:150% 0} }
  #status { padding:4px 12px; font-size:12px; color:var(--muted); min-height:22px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status.err { color:var(--err); } #status.ok { color:var(--accent); }

  #stage { flex:1; position:relative; min-height:0; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; display:none; }
  iframe.active { display:block; }
  #home { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; }
  #home h1 { font-size:3rem; margin:0 0 4px; letter-spacing:.1em; }
  #home p { color:var(--muted); margin:0; }
  #homeForm { display:flex; gap:8px; width:100%; max-width:560px; margin-top:26px; }
  #homeInput { flex:1; min-width:0; height:48px; padding:0 18px; border-radius:24px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:16px; }
  #homeInput:focus { outline:2px solid var(--accent); border-color:transparent; }
  #homeBtn { height:48px; padding:0 22px; border:0; border-radius:24px; background:var(--accent); color:#062b1f; font-weight:600; font-size:15px; cursor:pointer; }
  #homeBtn:disabled { opacity:.5; cursor:default; }
  #home small { color:var(--muted); margin-top:18px; opacity:.7; }
</style>
<script src="https://cdn.jsdelivr.net/npm/libcurl.js@latest/libcurl_full.js"></script>
</head>
<body>
<div id="tabstrip"><button id="newTab" title="New tab (Alt+T)">+</button></div>
<div id="bar">
  <button id="backBtn" title="Back (Alt+←)" disabled>←</button>
  <button id="fwdBtn" title="Forward (Alt+→)" disabled>→</button>
  <button id="reloadBtn" title="Reload" disabled>⟳</button>
  <form id="addr" autocomplete="off">
    <input id="urlInput" type="text" placeholder="Search or enter address" spellcheck="false" autocapitalize="off">
    <button id="goBtn" type="submit" disabled>Loading…</button>
  </form>
</div>
<div id="progress"></div>
<div id="status">Initializing WebAssembly runtime…</div>
<div id="stage">
  <div id="home"><h1>JUNIOR</h1><p>"its pretty ok"</p>
    <form id="homeForm" autocomplete="off">
      <input id="homeInput" type="text" placeholder="Search or enter address" spellcheck="false" autocapitalize="off">
      <button id="homeBtn" type="submit" disabled>Go</button>
    </form>
    <small>Alt+T new tab · Alt+W close tab · Ctrl+L address bar · Ctrl/middle-click a link to open it in a background tab</small></div>
</div>

<script>
const GATEWAY = 'wss://wisp.mercurywork.shop';
const MAX_META_REFRESH = 5;

const $ = id => document.getElementById(id);
const urlInput = $('urlInput'), goBtn = $('goBtn'), stage = $('stage'), tabstrip = $('tabstrip');
const backBtn = $('backBtn'), fwdBtn = $('fwdBtn'), reloadBtn = $('reloadBtn');

let ready = false;
let tabs = [], activeId = null, nextId = 1, lastHomeTab = null;
function focusHome() { requestAnimationFrame(() => $('homeInput').focus()); }

/* ================= tab model ================= */
function createTab() {
  const iframe = document.createElement('iframe');
  iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-downloads');
  stage.appendChild(iframe);
  const tab = { id: nextId++, iframe, title: 'New Tab', addr: '', history: [], idx: -1, token: 0, blobUrl: null,
                loading: false, status: ready ? 'Ready' : 'Initializing WebAssembly runtime…', statusKind: '', error: false, pending: null };
  tabs.push(tab);
  return tab;
}
function openTab(url, { background = false } = {}) {
  const tab = createTab();
  if (!background || !activeId) activeId = tab.id;
  if (url) navigate(tab, url);
  render();
  if (!url && activeId === tab.id) focusHome();
  return tab;
}
function closeTab(id) {
  const i = tabs.findIndex(t => t.id === id); if (i < 0) return;
  const tab = tabs[i];
  tab.token++;                                   // cancel in-flight loads
  if (tab.blobUrl) URL.revokeObjectURL(tab.blobUrl);
  tab.iframe.remove();
  tabs.splice(i, 1);
  if (!tabs.length) { openTab(); return; }
  if (activeId === id) activeId = tabs[Math.min(i, tabs.length - 1)].id;
  render();
}
function switchTab(id) { activeId = id; render(); }
const active = () => tabs.find(t => t.id === activeId);
const tabFor = win => tabs.find(t => t.iframe.contentWindow === win);

/* ================= UI rendering ================= */
function render() {
  // tab strip
  tabstrip.querySelectorAll('.tab').forEach(n => n.remove());
  const plus = $('newTab');
  for (const t of tabs) {
    const el = document.createElement('div');
    el.className = 'tab' + (t.id === activeId ? ' active' : '') + (t.loading ? ' loading' : '') + (t.error ? ' error' : '');
    el.title = t.title;
    el.innerHTML = '<span class="dot"></span><span class="ttl"></span><button class="x" title="Close tab">×</button>';
    el.querySelector('.ttl').textContent = t.title;
    el.onclick = () => switchTab(t.id);
    el.onauxclick = e => { if (e.button === 1) { e.preventDefault(); closeTab(t.id); } };
    el.querySelector('.x').onclick = e => { e.stopPropagation(); closeTab(t.id); };
    tabstrip.insertBefore(el, plus);
  }
  const t = active(); if (!t) return;
  // viewport
  tabs.forEach(x => x.iframe.classList.toggle('active', x.id === t.id && x.idx >= 0));
  $('home').style.display = t.idx < 0 ? 'flex' : 'none';
  if (t.idx < 0 && lastHomeTab !== t.id) { $('homeInput').value = ''; }
  lastHomeTab = t.idx < 0 ? t.id : null;
  $('homeBtn').disabled = !ready;
  // toolbar
  if (document.activeElement !== urlInput || true) urlInput.value = t.addr;
  backBtn.disabled = t.idx <= 0;
  fwdBtn.disabled = t.idx >= t.history.length - 1;
  reloadBtn.disabled = t.idx < 0;
  $('progress').classList.toggle('on', t.loading);
  const s = $('status'); s.textContent = t.status; s.className = t.statusKind;
  document.title = t.idx >= 0 ? t.title + ' – JUNIOR' : 'JUNIOR';
}
function setStatus(tab, msg, kind = '') {
  tab.status = msg || ''; tab.statusKind = kind;
  if (tab.id === activeId) { const s = $('status'); s.textContent = tab.status; s.className = kind; }
}

/* ================= helpers ================= */
function normalizeInput(raw) {
  const input = raw.trim();
  if (!input) return null;
  if (/^(about|data|blob|javascript):/i.test(input)) return null;
  if (/^https?:\/\//i.test(input)) return input;
  if (/^\/\//.test(input)) return 'https:' + input;
  const noSpace = !/\s/.test(input);
  if (noSpace && /^(localhost|\d{1,3}(\.\d{1,3}){3}|[a-z0-9-]+(\.[a-z0-9-]+)+)(:\d+)?([/?#].*)?$/i.test(input)) {
    const scheme = /^(localhost|\d{1,3}(\.\d{1,3}){3})/i.test(input) ? 'http://' : 'https://';
    return scheme + input;
  }
  return 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(input);
}
function resolveUrl(href, base) { try { return new URL(href, base).href; } catch { return null; } }
function decodeBody(buf, contentType) {
  let charset = (/charset=([^;\s]+)/i.exec(contentType || '') || [])[1];
  if (!charset) {
    const head = new TextDecoder('latin1').decode(buf.slice(0, 2048));
    charset = (/<meta[^>]+charset=["']?\s*([\w-]+)/i.exec(head) || [])[1];
  }
  try { return new TextDecoder(charset || 'utf-8').decode(buf); }
  catch { return new TextDecoder('utf-8').decode(buf); }
}
function decodeEntities(s) { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }
function hostOf(u) { try { return new URL(u).host; } catch { return u; } }
function filenameFrom(disp, url) {
  const m = /filename\*?=(?:UTF-8'')?["']?([^"';]+)/i.exec(disp || '');
  if (m) { try { return decodeURIComponent(m[1]); } catch { return m[1]; } }
  try { return decodeURIComponent(new URL(url).pathname.split('/').filter(Boolean).pop() || 'download'); } catch { return 'download'; }
}
function saveBlob(blob, name) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 10000);
}

/* ================= injected into every proxied page ================= */
const INJECT = `<script>(function(){
  var P = function(m){ parent.postMessage(Object.assign({junior:1}, m), '*'); };
  var skip = /^(#|javascript:|mailto:|tel:|sms:|data:|blob:)/i;

  document.addEventListener('click', function(e){
    if (e.defaultPrevented) return;
    var a = e.target.closest && e.target.closest('a[href], area[href]');
    if (!a) return;
    var raw = a.getAttribute('href');
    if (!raw || skip.test(raw.trim())) return;
    e.preventDefault();
    if (a.hasAttribute('download')) { P({type:'download', url:a.href, name:a.getAttribute('download')}); return; }
    if (e.ctrlKey || e.metaKey) { P({type:'newtab', url:a.href, background:true}); return; }
    if (e.shiftKey || /^_blank$/i.test(a.getAttribute('target') || '')) { P({type:'newtab', url:a.href}); return; }
    P({type:'nav', url:a.href});
  }, true);

  document.addEventListener('auxclick', function(e){
    var a = e.target.closest && e.target.closest('a[href]');
    if (e.button === 1 && a) {
      e.preventDefault();
      var raw = a.getAttribute('href');
      if (raw && !skip.test(raw.trim())) P({type:'newtab', url:a.href, background:true});
    }
  }, true);

  document.addEventListener('submit', function(e){
    var f = e.target; if (e.defaultPrevented) return;
    e.preventDefault();
    var sub = e.submitter;
    var action = (sub && sub.getAttribute('formaction')) || f.getAttribute('action');
    var url = action ? new URL(action, document.baseURI).href : document.baseURI;
    var method = ((sub && sub.getAttribute('formmethod')) || f.getAttribute('method') || 'get').toLowerCase();
    var fd = new FormData(f);
    if (sub && sub.name) fd.append(sub.name, sub.value);
    var usp = new URLSearchParams();
    fd.forEach(function(v,k){ usp.append(k, typeof v === 'string' ? v : (v.name || '')); });
    var newtab = /^_blank$/i.test(f.getAttribute('target') || '');
    if (method === 'post') {
      P({type: newtab ? 'newtab' : 'nav', url:url, method:'POST', body:usp.toString(), contentType:'application/x-www-form-urlencoded'});
    } else {
      var u = new URL(url); u.search = ''; usp.forEach(function(v,k){ u.searchParams.append(k, v); }); u.hash = '';
      P({type: newtab ? 'newtab' : 'nav', url:u.href});
    }
  }, true);

  window.open = function(u){ if (u) P({type:'newtab', url:new URL(u, document.baseURI).href}); return null; };

  document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('a[target], form[target]').forEach(function(n){ n.removeAttribute('target'); });
  });
  window.addEventListener('hashchange', function(){ P({type:'hash', url:document.baseURI.split('#')[0] + location.hash}); });
})();<\/script>`;

/* ================= core loader (per tab) ================= */
async function navigate(tab, target, opts = {}) {
  const { method = 'GET', body, contentType, push = true, metaDepth = 0 } = opts;
  if (!ready) { tab.pending = { target, opts }; tab.addr = target; setStatus(tab, 'Waiting for runtime…'); render(); return; }
  const token = ++tab.token;
  tab.loading = true; tab.error = false; tab.addr = target;
  if (tab.title === 'New Tab' || tab.idx < 0) tab.title = hostOf(target);
  setStatus(tab, 'Loading ' + target + '…'); render();

  try {
    const headers = { 'User-Agent': navigator.userAgent };
    if (body != null) headers['Content-Type'] = contentType || 'application/x-www-form-urlencoded';
    const init = { method, headers, redirect: 'follow' };
    if (body != null && method !== 'GET') init.body = body;

    const res = await libcurl.fetch(target, init);
    if (token !== tab.token) return;

    const finalUrl = res.url || target;
    const ctype = (res.headers.get('content-type') || '').toLowerCase();
    const disp = res.headers.get('content-disposition') || '';

    const refreshHdr = res.headers.get('refresh');
    if (refreshHdr && metaDepth < MAX_META_REFRESH) {
      const m = /url=\s*['"]?([^'";]+)/i.exec(refreshHdr);
      if (m) { const u = resolveUrl(m[1], finalUrl); if (u) return navigate(tab, u, { push, metaDepth: metaDepth + 1 }); }
    }

    const buf = await res.arrayBuffer();
    if (token !== tab.token) return;

    const finishDownload = () => {
      const name = filenameFrom(disp, finalUrl);
      saveBlob(new Blob([buf], { type: ctype }), name);
      tab.loading = false; tab.addr = tab.idx >= 0 ? tab.history[tab.idx].url : '';
      setStatus(tab, 'Downloaded ' + name, 'ok'); render();
    };
    if (/attachment/i.test(disp)) return finishDownload();

    let page, title = hostOf(finalUrl);
    const isHtml = !ctype || /text\/html|application\/xhtml/.test(ctype);
    if (isHtml) {
      let html = decodeBody(buf, ctype);

      const mr = /<meta[^>]+http-equiv=["']?refresh["']?[^>]*content=["']?\s*\d*\s*;?\s*url=\s*['"]?([^'">\s]+)/i.exec(html);
      if (mr && metaDepth < MAX_META_REFRESH) {
        const u = resolveUrl(decodeEntities(mr[1]), finalUrl);
        if (u && u !== finalUrl) return navigate(tab, u, { push, metaDepth: metaDepth + 1 });
      }

      const tm = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(html);
      if (tm && tm[1].trim()) title = decodeEntities(tm[1].replace(/\s+/g, ' ').trim());

      const pb = /<base[^>]+href=["']([^"']+)["']/i.exec(html);
      const baseHref = pb ? (resolveUrl(pb[1], finalUrl) || finalUrl) : finalUrl;

      html = html.replace(/<meta[^>]+http-equiv=["']?(content-security-policy|x-frame-options|refresh)["']?[^>]*>/gi, '')
                 .replace(/<base\b[^>]*>/gi, '')
                 .replace(/\sintegrity=("[^"]*"|'[^']*')/gi, '')
                 .replace(/\scrossorigin(=("[^"]*"|'[^']*'|[^\s>]+))?/gi, '');

      const inject = `<base href="${baseHref.replace(/"/g, '&quot;')}">` + INJECT;
      if (/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i, m => m + inject);
      else if (/<html[^>]*>/i.test(html)) html = html.replace(/<html[^>]*>/i, m => m + '<head>' + inject + '</head>');
      else html = '<!DOCTYPE html><head>' + inject + '</head>' + html;
      page = { html };
    } else if (/^(image|video|audio)\/|application\/pdf|^text\/|json|xml/.test(ctype)) {
      page = { blob: new Blob([buf], { type: ctype }) };
      title = filenameFrom(disp, finalUrl);
    } else {
      return finishDownload();
    }

    const entry = { url: finalUrl, method, body, contentType, title };
    if (push || tab.idx < 0) { tab.history = tab.history.slice(0, tab.idx + 1); tab.history.push(entry); tab.idx = tab.history.length - 1; }
    else tab.history[tab.idx] = entry;

    showPage(tab, page);
    tab.addr = finalUrl; tab.title = title;
    setStatus(tab, finalUrl !== target ? 'Redirected to ' + finalUrl : (res.ok ? '' : `HTTP ${res.status}`), res.ok ? '' : 'err');
    if (!res.ok) tab.error = true;
  } catch (err) {
    if (token !== tab.token) return;
    console.error(err);
    showError(tab, target, err);
  } finally {
    if (token === tab.token) { tab.loading = false; render(); }
  }
}

function showPage(tab, page) {
  if (tab.blobUrl) { URL.revokeObjectURL(tab.blobUrl); tab.blobUrl = null; }
  if (page.html != null) { tab.iframe.removeAttribute('src'); tab.iframe.srcdoc = page.html; }
  else { tab.blobUrl = URL.createObjectURL(page.blob); tab.iframe.removeAttribute('srcdoc'); tab.iframe.src = tab.blobUrl; }
}

function showError(tab, target, err) {
  const msg = String(err && err.message || err);
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  showPage(tab, { html: `<!DOCTYPE html><meta charset="utf-8"><body style="font-family:system-ui;background:#111827;color:#f3f4f6;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center">
    <div style="max-width:480px;padding:20px"><h2 style="margin:0 0 8px">Can't reach this page</h2>
    <p style="color:#9ca3af;word-break:break-all">${esc(target)}</p><p style="color:#f87171">${esc(msg)}</p>
    <p style="color:#9ca3af;font-size:14px">Check the address, or try again with the reload button.</p></div></body>` });
  if (tab.idx < 0 || tab.history[tab.idx].url !== target) {
    tab.history = tab.history.slice(0, tab.idx + 1); tab.history.push({ url: target, method: 'GET', title: hostOf(target) });
    tab.idx = tab.history.length - 1;
  }
  tab.title = 'Failed to load'; tab.error = true;
  setStatus(tab, 'Failed to load: ' + msg, 'err');
}

async function downloadUrl(tab, url, name) {
  try {
    setStatus(tab, 'Downloading…');
    const res = await libcurl.fetch(url, { headers: { 'User-Agent': navigator.userAgent } });
    saveBlob(new Blob([await res.arrayBuffer()], { type: res.headers.get('content-type') || '' }),
             name || filenameFrom(res.headers.get('content-disposition'), res.url || url));
    setStatus(tab, 'Download complete', 'ok');
  } catch (e) { setStatus(tab, 'Download failed: ' + e.message, 'err'); }
}

/* ================= messages from proxied pages ================= */
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || !d.junior) return;
  const tab = tabFor(e.source); if (!tab) return;
  if (d.type === 'nav' && /^https?:/i.test(d.url)) {
    navigate(tab, d.url, { method: d.method || 'GET', body: d.body, contentType: d.contentType });
  } else if (d.type === 'newtab' && /^https?:/i.test(d.url)) {
    const nt = createTab();
    if (!d.background) activeId = nt.id;
    navigate(nt, d.url, { method: d.method || 'GET', body: d.body, contentType: d.contentType });
    render();
  } else if (d.type === 'download') {
    downloadUrl(tab, d.url, d.name);
  } else if (d.type === 'hash') {
    tab.addr = d.url; if (tab.id === activeId) urlInput.value = d.url;
  }
});

/* ================= UI wiring ================= */
$('addr').addEventListener('submit', e => {
  e.preventDefault();
  const t = normalizeInput(urlInput.value), tab = active();
  if (t && tab) navigate(tab, t);
});
urlInput.addEventListener('focus', () => urlInput.select());
$('homeForm').addEventListener('submit', e => {
  e.preventDefault();
  const t = normalizeInput($('homeInput').value), tab = active();
  if (t && tab) navigate(tab, t);
});
$('newTab').onclick = () => openTab();
backBtn.onclick = () => { const t = active(); if (t && t.idx > 0) { t.idx--; const h = t.history[t.idx]; navigate(t, h.url, { ...h, push: false }); } };
fwdBtn.onclick  = () => { const t = active(); if (t && t.idx < t.history.length - 1) { t.idx++; const h = t.history[t.idx]; navigate(t, h.url, { ...h, push: false }); } };
reloadBtn.onclick = () => { const t = active(); if (t && t.idx >= 0) { const h = t.history[t.idx]; navigate(t, h.url, { ...h, push: false }); } };

document.addEventListener('keydown', e => {
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); backBtn.click(); }
  else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); fwdBtn.click(); }
  else if (e.altKey && e.key.toLowerCase() === 't') { e.preventDefault(); openTab(); }
  else if (e.altKey && e.key.toLowerCase() === 'w') { e.preventDefault(); closeTab(activeId); }
  else if (e.altKey && /^[1-9]$/.test(e.key)) { const t = tabs[+e.key - 1]; if (t) { e.preventDefault(); switchTab(t.id); } }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') { e.preventDefault(); urlInput.focus(); }
});

function initialTarget() {
  const q = new URLSearchParams(location.search).get('url') || decodeURIComponent(location.hash.slice(1));
  return q ? normalizeInput(q) : null;
}

/* ================= boot ================= */
openTab();                                   // first tab exists immediately
focusHome();

window.addEventListener('load', async () => {
  try {
    await libcurl.ready;
    libcurl.set_websocket(GATEWAY);
    ready = true;
    goBtn.disabled = false; goBtn.textContent = 'Go';
    tabs.forEach(t => { if (!t.pending) setStatus(t, 'Ready', 'ok'); });
    const init = initialTarget();
    if (init && tabs[0] && !tabs[0].pending) tabs[0].pending = { target: init, opts: {} };
    for (const t of tabs) if (t.pending) { const p = t.pending; t.pending = null; navigate(t, p.target, p.opts); }
    render();
  } catch (e) {
    console.error(e);
    goBtn.textContent = 'Failed';
    tabs.forEach(t => setStatus(t, 'WASM init failed: ' + e.message, 'err'));
  }
});
</script>
</body>
</html>
